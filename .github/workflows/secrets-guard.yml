# The one rule prose in this project kept getting wrong: a PF configArchive is a plain zip that
# CONTAINS pf.jwk, so no archive and no key material may ever be tracked. data.staging.zip was
# committed under the belief that "encrypted with pf.jwk" made it safe; it did not.
#
# Copied from pf-agentic-identity, because since 2026-08-21 the archives live HERE - the guard belongs
# with the thing it guards. Patterns are filename-based AND content-based: an age identity can be named
# anything, so the filename globs alone would not catch one.
name: Secrets guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no config archive or key material may be tracked
        run: |
          tracked="$(git ls-files \
            '*.zip' \
            '*pf.jwk' \
            '*pingfederate-system-keys.xml' \
            '*.jwk' '*.jks' '*.p12' '*.pfx' '*.lic')"
          if [ -n "$tracked" ]; then
            echo "::error::These must never be tracked - a PF configArchive contains pf.jwk itself:"
            printf '%s\n' "$tracked"
            exit 1
          fi
          echo "clean: no PF config archive or key material is tracked by filename"

      - name: no age identity or private key may be tracked (content scan)
        run: |
          # age identities and PEM private keys, wherever they are and whatever they are called.
          hits="$(git grep -l -E 'AGE-SECRET-KEY-1|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . \
                  ':!*age-recipients/README.md' ':!.github/workflows/secrets-guard.yml' || true)"
          if [ -n "$hits" ]; then
            echo "::error::These contain an age identity or a private key:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "clean: no age identity or private key is tracked"
