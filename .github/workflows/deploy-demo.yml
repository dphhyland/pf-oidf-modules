name: Deploy demo (Railway)

# Push-to-deploy for the OIDF demo UI (pf-demo-ui) — single-branch model:
#   push to main            -> deploy to STAGING (automatic)
#   workflow_dispatch       -> deploy to STAGING or PRODUCTION (choose; production is deliberate)
#
# Until 2026-08-15 staging was fed by a long-lived `sd-jwt-rar-paz` branch that sat at the same commit
# as main and was named after two things that no longer exist (SD-JWT was dropped in 0fe0d28; the
# RAR→PingAuthorize plugin moved to pf-agentic-identity) — and main auto-deployed PRODUCTION, so an
# ordinary merge shipped to prod. One branch now, and production is an explicit choice. Same model as
# pf-agentic-identity, so the two repos behave alike.
#
# Only fires when the demo build context changes. The PF services are NOT deployed here at all — since
# 2026-08-15 pingfederate-runtime / lighthouse / fedhost are deployed from the pf-agentic-identity
# monorepo (deploy/), which is also where their build contexts and Terraform live. This repo deploys the
# demo UI and nothing else. Requires two repo secrets, each a Railway PROJECT token scoped
# to the matching environment of project e02a8e2f:
#   RAILWAY_TOKEN_STAGING   (staging)
#   RAILWAY_TOKEN_PROD      (production)

on:
  push:
    branches: [main]
    paths:
      - "harness/ui/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: staging or production
        type: choice
        options: [staging, production]
        default: staging
        required: true

concurrency:
  group: deploy-demo-${{ github.ref }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: true

jobs:
  staging:
    # every push to main, plus an explicit dispatch that picks staging
    if: github.event_name == 'push' || inputs.environment == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @railway/cli
      - name: railway up → pf-demo-ui (staging)
        working-directory: harness/ui
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: railway up --ci --service pf-demo-ui

  production:
    # never automatic — dispatch only, and only when production was chosen
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @railway/cli
      - name: railway up → pf-demo-ui (production)
        working-directory: harness/ui
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
        run: railway up --ci --service pf-demo-ui
